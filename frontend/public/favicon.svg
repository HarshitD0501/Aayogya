<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#e8a838" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2234" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  
  <!-- Left Leaf Wing -->
  <path d="M 20 72 C 14 58 26 46 38 52 C 40 64 30 76 20 72 Z" fill="url(#goldGrad)" opacity="0.95" />
  
  <!-- Right Leaf Wing -->
  <path d="M 80 72 C 86 58 74 46 62 52 C 60 64 70 76 80 72 Z" fill="url(#goldGrad)" opacity="0.95" />
  
  <!-- Central Golden Leaf / Teardrop -->
  <path d="M 50 16 C 66 32 72 58 50 78 C 28 58 34 32 50 16 Z" fill="url(#goldGrad)" />
  
  <!-- Heartbeat ECG Pulse Line (Cutout) -->
  <path d="M 32 50 L 42 50 L 47 38 L 52 64 L 57 44 L 61 52 L 68 50" 
        fill="none" 
        stroke="#1a2234" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
